<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hola, soy Nidal. I build small apps that do one thing well.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7c6cf5"><animate attributeName="stop-color" values="#7c6cf5;#f2709c;#38b6c9;#7c6cf5" dur="14s" repeatCount="indefinite"/></stop>
<stop offset=".55" stop-color="#e86fb0"><animate attributeName="stop-color" values="#e86fb0;#f5a25d;#6a7cf0;#e86fb0" dur="14s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#f5a25d"><animate attributeName="stop-color" values="#f5a25d;#7c6cf5;#e86fb0;#f5a25d" dur="14s" repeatCount="indefinite"/></stop>
</linearGradient>
<radialGradient id="d" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d5d9e0"/><stop offset="1" stop-color="#8d95a3"/></radialGradient>
</defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/>
<g fill="#fff" opacity=".13"><circle cx="90" cy="250" r="70"/><circle cx="1090" cy="40" r="90"/><circle cx="640" cy="290" r="50"/></g>
<g><animateTransform attributeName="transform" type="translate" values="62 0;1138 0;62 0" dur="7s" begin="-2.8s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="translate" values="0 62;0 238;0 62" dur="4.3s" begin="-1s" repeatCount="indefinite"/>
<g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
<circle r="62" fill="#000" opacity=".18" cx="3" cy="5"/>
<circle r="60" fill="url(#d)" stroke="#fff" stroke-width="3"/>
<circle r="46" fill="none" stroke="#8d95a3" stroke-width="1.5" stroke-dasharray="3 5"/>
<text font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji',sans-serif" font-weight="800" font-size="38" fill="#3b4252" text-anchor="middle" y="13">NY</text>
</g></g></g>
<g font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,'Apple Color Emoji','Segoe UI Emoji',sans-serif" font-weight="800">
<text x="64" y="160" font-size="120" fill="#000" opacity=".22" transform="translate(3 4)">klk 🗿</text>
<text x="64" y="160" font-size="120" fill="#fff">klk 🗿</text>
<text x="66" y="212" font-size="30" font-weight="600" fill="#000" opacity=".2" transform="translate(2 3)">shipping apps instead of sleeping</text>
<text x="66" y="212" font-size="30" font-weight="600" fill="#fff">shipping apps instead of sleeping</text>
</g>
</svg>
